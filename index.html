<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f8fb" />
<title>File Shelf</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <p class="eyebrow">Shared downloads</p>
      <h1>File Shelf</h1>
    </div>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>Available files</h2>
        <p id="status">Loading files...</p>
      </div>
      <span class="count" id="count">0</span>
    </div>

    <div class="file-list" id="file-list" aria-live="polite"></div>

    <div class="empty" id="empty" hidden>
      <h3>No files found</h3>
      <p>Add files to the <b>file</b> folder and push the repo.</p>
    </div>
  </section>
</main>

<template id="file-row-template">
  <article class="file-row">
    <div class="file-type"></div>
    <div class="file-main">
      <h3></h3>
      <p></p>
    </div>
    <a class="download" href="#" download>Download</a>
  </article>
</template>

<script src="main.js"></script>
</body>
</html>
